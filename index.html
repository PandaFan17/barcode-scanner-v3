<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>QR Scanner</title>

  <script type="module">
import { BrowserQRCodeReader } from "https://cdn.jsdelivr.net/npm/@zxing/browser@latest/+esm";

const codeReader = new BrowserQRCodeReader();

const videoElement = document.createElement("video");
document.getElementById("reader").appendChild(videoElement);

codeReader.decodeFromVideoDevice(null, videoElement, (result, err) => {
  if (result) {
    document.getElementById("result").innerText = result.getText();
  }
});
</script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    #reader {
      width: 320px;
      margin: auto;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h2>QR Code Scanner</h2>

  <div id="reader"></div>

  <div id="result">Waiting for scan...</div>

  <script src="script.js"></script>
</body>
</html>

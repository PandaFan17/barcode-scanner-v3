<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Code 39 Barcode Scanner</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    margin: 0;
}

h2 {
    margin-bottom: 20px;
}

.controls {
    margin-bottom: 20px;
}

select,
button {
    padding: 10px;
    font-size: 16px;
    margin: 5px;
}

video {
    width: 100%;
    max-width: 900px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

#result {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    word-break: break-all;
}

#status {
    margin-top: 10px;
    color: #666;
}

.success {
    color: green;
}

.error {
    color: red;
}
</style>
</head>

<body>

<h2>Code 39 Barcode Scanner</h2>

<div class="controls">
    <select id="cameraSelect"></select>
    <button id="startBtn">Start Scanner</button>
    <button id="stopBtn">Stop Scanner</button>
</div>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<div id="result">Waiting for scan...</div>
<div id="status">Initializing...</div>

<script type="module" src="script.js"></script>

</body>
</html>
